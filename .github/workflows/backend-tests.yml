name: Backend Tests

# Lints, type-checks, and runs the backend unit suite (pytest tests/backend/) on
# this repo and on any challenge repo forked from it. This and hf-space-checks.yml
# are the two workflows active out of the box. deploy.yml / deploy-hf-space.yml /
# naming-guardrail.yml ship under .github/workflows.disabled/ and are enabled per
# docs/SETUP.md.
#
# Runs unconditionally on every push/PR to main/hf_testing (not path-filtered)
# so it can be a required branch-protection status check without blocking
# docs-only PRs that would otherwise never trigger a path-filtered run.

on:
  push:
    branches: [main, hf_testing]
  pull_request:
    branches: [main, hf_testing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}  # required for micromamba env activation

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up micromamba environment
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: environment.yml
          cache-environment: true

      - name: Work around broken RDKit stub package
        # RDKit bundles auto-generated .pyi stubs (rdkit-stubs) that periodically
        # contain invalid signatures (e.g. a parameter without a default following
        # one with a default), which makes mypy abort with a syntax error before it
        # can check anything. This is a long-standing, unresolved upstream issue
        # that recurs in different files across releases (see rdkit/rdkit#8339,
        # #7554, #8673, #7378). openstructure's version is intentionally unpinned
        # above, so the exact rdkit version — and whether its stubs are currently
        # broken, or whether this build of openstructure even pulls in rdkit at
        # all — can vary between runs. Every rdkit import in backend/ already
        # carries a `# type: ignore[import]`, which mypy honors whether rdkit is
        # merely untyped or entirely absent, so skip this step gracefully instead
        # of failing when there's no rdkit-stubs (or no rdkit) to clean up.
        run: |
          python -c "
          import importlib.util
          if importlib.util.find_spec('rdkit') is not None:
              import os, shutil, rdkit
              sp = os.path.dirname(os.path.dirname(rdkit.__file__))
              shutil.rmtree(os.path.join(sp, 'rdkit-stubs'), ignore_errors=True)
          "

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Type check (mypy)
        run: mypy backend/

      - name: Docstring check (pydoclint)
        run: pydoclint backend/

      - name: Run backend tests
        run: pytest tests/backend/ -v --cov=backend --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore
