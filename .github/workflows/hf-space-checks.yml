name: HF Space Code Quality

# Lints/type-checks hf_space/ (the Gradio app) and runs its unit tests
# (tests/hf_space/), using a lightweight pip install of hf_space/requirements.txt,
# not the full conda environment.yml used by backend-tests.yml, so an
# hf_space-only change doesn't pay for the heavier backend setup.
#
# Tool versions (ruff/mypy/pydoclint) are pinned separately from environment.yml's
# dev-tool versions, matching this repo's existing convention of hf_space/
# tracking its own dependency versions independently of backend/.

on:
  push:
    branches: [main, hf_testing]
    paths:
      - 'hf_space/**'
      - 'tests/hf_space/**'
      - 'pyproject.toml'
      - 'pytest.ini'
      - '.github/workflows/hf-space-checks.yml'
  pull_request:
    branches: [main, hf_testing]
    paths:
      - 'hf_space/**'
      - 'tests/hf_space/**'
      - 'pyproject.toml'
      - 'pytest.ini'
      - '.github/workflows/hf-space-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space-checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r hf_space/requirements.txt
          pip install ruff==0.15.20 mypy==2.2.0 pydoclint==0.9.1 pytest==9.1.1 pytest-cov==7.1.0 \
            pandas-stubs==3.1.0.261029 "boto3-stubs[s3]==1.43.92"

      - name: Lint (ruff)
        run: ruff check hf_space/

      - name: Type check (mypy)
        run: mypy hf_space/

      - name: Docstring check (pydoclint)
        run: pydoclint hf_space/

      - name: Unit tests
        run: pytest tests/hf_space/ -v --cov=hf_space --cov-report=term-missing

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hf-space-coverage-report
          path: .coverage
          if-no-files-found: ignore
