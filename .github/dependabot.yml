version: 2

updates:
  # GitHub Actions in the workflows. Dependabot only scans .github/workflows/ —
  # the deploy workflows under .github/workflows.disabled/ get covered once a
  # challenge repo enables them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The Hugging Face Space's pinned pip deps (hf_space/requirements.txt).
  # backend/ deps and the dev/CI environment are conda-managed in environment.yml,
  # which Dependabot doesn't support — bump those by hand.
  - package-ecosystem: pip
    directory: /hf_space
    schedule:
      interval: weekly
    groups:
      hf-space:
        patterns: ["*"]
    ignore:
      # gradio-leaderboard==0.0.14 (used in hf_space/leaderboards.py) is pinned to
      # gradio<6.0 on PyPI with no 6.x-compatible release yet, and gradio 5.50.0
      # itself caps pandas<3.0 and pydantic<=2.12.3 — so a gradio major bump makes
      # the whole requirements.txt unresolvable. Remove this once gradio-leaderboard
      # supports gradio 6.
      - dependency-name: "gradio"
        update-types: ["version-update:semver-major"]
