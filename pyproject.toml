[tool.pydoclint]
style = "numpy"
arg-type-hints-in-docstring = true
check-return-types = true
require-return-section-when-returning-nothing = true

[tool.mypy]
python_version = "3.12"

# No stub package exists on PyPI for scikit-learn, which is otherwise untyped.
[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
